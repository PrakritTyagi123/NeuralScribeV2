# NeuralScribe v2 — Class Registry
# Full vocabulary: digits + Latin letters + Greek letters + scientific/math symbols
#
# DESIGN NOTES:
# - Greek uppercase Alpha (Α) and Beta (Β) are REMOVED because they render
#   identically to Latin A and B at 28x28.  The model cannot distinguish them.
# - Greek lowercase rho (ρ) is kept since it has a descender that differs from 'p'.
# - Visually confusable pairs are documented below for reference.
#
# Total: 118 classes (was 120, removed Alpha + Beta)

version: 2
total_classes: 118

classes:
  # ── Digits (0–9) ──
  - { id: 0,  label: "0", display: "0", category: digit }
