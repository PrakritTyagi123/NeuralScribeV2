model:
  stem_channels: 32
  block_channels:
  - 64
  - 128
  - 256
  - 320
  se_reduction: 16
  dropout: 0.2
  drop_path_rate: 0.05
  num_classes: 36
training:
  epochs: 10
  batch_size: 1024
  num_workers: 4
  pin_memory: true
  persistent_workers: true
optimizer:
  type: adamw
  lr: 0.002
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
scheduler:
  type: cosine_warm_restarts
  T_0: 15
  T_mult: 2
  eta_min: 1.0e-05
  warmup_epochs: 5
  warmup_start_lr: 0.0001
loss:
  type: cross_entropy
  label_smoothing: 0.04
  focal_gamma: 0.0
  focal_weight: 0.0
regularization:
  mixup_alpha: 0.15
  mixup_probability: 0.3
  cutmix_alpha: 0.0
  stochastic_depth: true
augmentation:
  online: false
  rotation_range:
  - -10
  - 10
  translation_range:
  - -1
  - 1
  scale_range:
  - 0.95
  - 1.05
mixed_precision:
  enabled: true
checkpointing:
  save_best: true
  save_interval: 10
  max_checkpoints: 5
  models_dir: models/english
  metadata: true
validation:
  per_class_metrics: true
  confusion_matrix: true
  top_confusions: 10
logging:
  ws_throttle_seconds: 1.0
  log_every_n_batches: 50
dataset:
  cache_path: datasets/english/cache/cached_dataset.pt
class_registry: configs/languages/english/class_registry.yaml
