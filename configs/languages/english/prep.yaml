dataset:
  emnist_root: datasets/english/raw/emnist
preprocessing:
  image_size: 28
  center_of_mass: true
  smoothing:
    enabled: true
    sigma: 0.5
augmentation:
  precompute_factor: 3
  rotation_range:
  - -12
  - 12
  translation_range:
  - -2
  - 2
  scale_range:
  - 0.9
  - 1.1
  shear_range:
  - -5
  - 5
split:
  test_ratio: 0.15
  val_ratio: 0.1
  stratified: true
  seed: 42
